name: Create a Release on Tag

# Pushing a tag vX.Y.Z builds the package, creates a GitHub Release and
# publishes to PyPI through trusted publishing (no API token: PyPI trusts
# the OIDC token of this workflow, see
# https://docs.pypi.org/trusted-publishers/). The tag must match the
# version in pyproject.toml; the version is not rewritten here.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: pip install build twine

    - name: Check that the tag matches the package version
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        if [ "$tag" != "$version" ]; then
          echo "tag v$tag does not match pyproject.toml version $version" >&2
          exit 1
        fi

    - name: Build distribution
      run: |
        python -m build
        python -m twine check dist/*

    - name: Create GitHub Release and upload artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
